# Native MUSA kernel optimization with MCU profiling.
strategy: greedy
num_workers: 1
strategy_config:
  max_no_improvement: 5
openai_model: gpt-5.6-sol
# Select none/low/medium/high/xhigh/max with OPENAI_REASONING_EFFORT.
# The legacy boolean stays false so it does not override that environment value.
high_reasoning_effort: false

benchmark_warmup: 5
benchmark_repeat: 20
divergence_threshold: 50.0
target_platform: musa
kernel_backend: musa
enable_experience_memory: true
gpu_name: null

platform:
  verifier: musa
  benchmarker: musa
  worker_runner: musa
  specs_provider: musa
  profiler: musa
  roofline_analyzer: musa
  bottleneck_analyzer: musa
  rag_prescriber: musa

templates:
  kernel_optimization: triton_kernel_agent/templates/musa_kernel_optimization.j2
  reflexion_prompt: triton_kernel_agent/templates/reflexion_prompt.j2
  triton_guidelines: triton_kernel_agent/templates/musa_guidelines.j2
